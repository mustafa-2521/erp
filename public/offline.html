<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Offline · Mustafa Inks ERP</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #F8FAFC; color: #0F172A; }
  @media (prefers-color-scheme: dark) { body { background: #0B1120; color: #E2E8F0; } p { color: #94A3B8 !important; } }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.25rem; color: #475569; line-height: 1.5; }
  button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #047857; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You&rsquo;re offline</h1>
  <p>Open the app once while connected so it can be saved on this device. Your data syncs automatically when you&rsquo;re back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
